# Minimal Supabase CLI configuration for Strato.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "cielo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "cielo://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

# Apple / Google: secrets are read from env (see docs/backend.md), never committed.
[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "per_worker"

# Webhooks are called by Stripe / RevenueCat without a Supabase JWT.
[functions.stripe-webhook]
verify_jwt = false

[functions.revenuecat-webhook]
verify_jwt = false

# Called by pg_cron with the service role key; the function checks it itself.
[functions.license-alerts]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = true

[functions.gdpr-export]
verify_jwt = true

[functions.gdpr-delete]
verify_jwt = true
